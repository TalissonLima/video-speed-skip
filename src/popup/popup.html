<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Speed &amp; Skip</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
        <rect width="32" height="32" rx="8" fill="url(#g)"/>
        <path d="M7 9v14l8-7zM15 9v14l8-7z" fill="#fff"/><rect x="24" y="9" width="2" height="14" rx="1" fill="#fff"/>
      </svg>
      <div>
        <h1>Video Speed &amp; Skip</h1>
        <p data-i18n="tagline"></p>
      </div>
    </div>
    <button id="gear" class="icon-btn" data-i18n-title="openSettings">⚙</button>
  </header>

  <section class="card site" id="siteBar">
    <div class="site-info">
      <span class="dot" id="dot"></span>
      <div><b id="siteHost"></b><small id="siteState"></small></div>
    </div>
    <input type="checkbox" id="siteOn" class="switch">
  </section>

  <section class="card" id="speedCard">
    <div class="row between">
      <span class="label" id="speedLabel"></span>
      <button id="reset" class="link" data-i18n="reset"></button>
    </div>
    <div class="speed">
      <button id="minus" class="round" aria-label="−">−</button>
      <output id="value">1.00×</output>
      <button id="plus" class="round" aria-label="+">+</button>
    </div>
    <input id="slider" type="range" min="0.25" max="4" step="0.05" value="1">
    <div class="chips" id="chips"></div>
  </section>

  <div class="stats" id="stats" role="link" tabindex="0" data-i18n-title="viewDashboard">
    <div class="stat"><span class="ico" aria-hidden="true">⏱</span><div><b id="saved">0s</b><small data-i18n="timeSaved"></small></div></div>
    <div class="stat"><span class="ico" aria-hidden="true">⏭</span><div><b id="skipped">0</b><small data-i18n="adsSkippedLabel"></small></div></div>
  </div>

  <section class="card list">
    <label class="item" data-i18n-title="adSkipDesc">
      <span><b data-i18n="adSkip"></b></span>
      <input type="checkbox" id="autoSkip" class="switch">
    </label>
    <label class="item" data-i18n-title="skipIntroDesc">
      <span><b data-i18n="skipIntro"></b></span>
      <input type="checkbox" id="skipIntro" class="switch">
    </label>
  </section>

  <button id="warn" class="warn" hidden></button>

  <p class="tip" id="tip"></p>

  <section class="support" id="support">
    <a id="bmc" class="btn primary" target="_blank" rel="noopener">☕ <span data-i18n="buyCoffee"></span></a>
    <button id="pix" class="btn" hidden></button>
  </section>

  <script src="../shared/defaults.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
