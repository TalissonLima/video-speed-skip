<!doctype html>
<meta charset="utf-8">
<title>Store screenshot: popup</title>
<!-- Used by tests/e2e/store_screenshots.py: the real popup, scaled up, next to a headline.
     Query: ?src=<popup url>&h=<headline>&p=<sub headline> -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; gap: 90px; color: #fff;
         background: linear-gradient(135deg, #4f46e5, #9333ea); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .copy { max-width: 470px; }
  h1 { font-size: 54px; line-height: 1.06; margin: 0 0 18px; letter-spacing: -.03em; }
  p { font-size: 22px; line-height: 1.4; margin: 0; opacity: .92; }
  .frame { width: 442px; height: 741px; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.35); background: #f6f7fb; }
  iframe { width: 340px; height: 570px; border: 0; transform: scale(1.3); transform-origin: top left; }
</style>
<div class="copy"><h1 id="h"></h1><p id="p"></p></div>
<div class="frame"><iframe id="f"></iframe></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('h').textContent = q.get('h') || '';
  document.getElementById('p').textContent = q.get('p') || '';
  document.getElementById('f').src = q.get('src');
</script>
