<!-- Stubs the extension API so the content script can run on a plain page. -->
<script>
  const store = {};
  const listeners = [];
  globalThis.chrome = { storage: {
    local: {
      get: async () => ({ ...store }),
      set: async (p) => { const ch = {}; for (const k in p) { ch[k] = { newValue: p[k] }; store[k] = p[k]; } listeners.forEach((l) => l(ch, "local")); }
    },
    onChanged: { addListener: (l) => listeners.push(l) }
  } };
</script>
