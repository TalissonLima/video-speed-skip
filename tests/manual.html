<!doctype html>
<meta charset="utf-8">
<title>VSS manual test</title>
<script>
  const store = {};
  const listeners = [];
  globalThis.chrome = { storage: {
    local: {
      get: async () => ({ ...store }),
      set: async (p) => { const ch = {}; for (const k in p) { ch[k] = { newValue: p[k] }; store[k] = p[k]; } listeners.forEach((l) => l(ch, "local")); }
    },
    onChanged: { addListener: (l) => listeners.push(l) }
  } };
</script>
<video id="v" width="480" height="270" controls muted loop src="silence.wav"></video>

<button id="nope" hidden>Skip to content</button>
<button id="intro" hidden data-uia="player-skip-intro">Skip Intro</button>
<button id="introText" hidden>Pular abertura</button></p>
