<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Speed &amp; Skip</title>
  <link rel="stylesheet" href="../src/shared/base.css">
  <link rel="stylesheet" href="../src/options/options.css">
<script>
const day = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const daily = {}; [0,1,2,3,5,6,7,9,10,12,13].forEach((n, i) => daily[day(n)] = { s: 600 + ((i * 937) % 2400), a: (i * 3) % 7 });
const store = {
  speedScope: "site", siteSpeeds: { "www.youtube.com": 1.5, "vimeo.com": 1.25, "coursera.org": 2 },
  skipCount: 128, savedSeconds: 19800, disabledSites: ["example.org"],
  stats: { daily, sites: { "www.youtube.com": { s: 12000, a: 90 }, "coursera.org": { s: 5400, a: 0 }, "vimeo.com": { s: 1800, a: 12 }, "twitch.tv": { s: 600, a: 26 } } }
};
globalThis.chrome = {
  storage: { local: { get: async () => ({ ...store }), set: async (x) => Object.assign(store, x), remove: async () => {} }, onChanged: { addListener() {} } },
  tabs: { query: async () => [{ url: "https://www.youtube.com/watch?v=demo" }] },
  runtime: { getManifest: () => ({ version: "0.3.0" }), openOptionsPage() {} }
};
</script></head>
<body>
<div class="shell">
  <nav class="side">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
        <rect width="32" height="32" rx="8" fill="url(#g)"/>
        <path d="M7 9v14l8-7zM15 9v14l8-7z" fill="#fff"/><rect x="24" y="9" width="2" height="14" rx="1" fill="#fff"/>
      </svg>
      <b>Video Speed &amp; Skip</b>
    </div>
    <a href="#dashboard" data-nav="dashboard"><span class="ni" aria-hidden="true">📊</span><span data-i18n="navDashboard"></span></a>
    <a href="#shortcuts" data-nav="shortcuts"><span class="ni" aria-hidden="true">⌨️</span><span data-i18n="navShortcuts"></span></a>
    <a href="#speed" data-nav="speed"><span class="ni" aria-hidden="true">⚡</span><span data-i18n="navSpeed"></span></a>
    <a href="#skip" data-nav="skip"><span class="ni" aria-hidden="true">⏭</span><span data-i18n="navSkip"></span></a>
    <a href="#appearance" data-nav="appearance"><span class="ni" aria-hidden="true">🎨</span><span data-i18n="navAppearance"></span></a>
    <a href="#data" data-nav="data"><span class="ni" aria-hidden="true">💾</span><span data-i18n="navData"></span></a>
  </nav>

  <main>
    <!-- ============ Dashboard ============ -->
    <section id="dashboard" data-section>
      <h2 data-i18n="dashTitle"></h2>
      <p class="sub" data-i18n="dashSubtitle"></p>

      <div class="kpis">
        <div class="kpi hero"><small data-i18n="kpiSaved"></small><b id="kSaved">0s</b></div>
        <div class="kpi"><small data-i18n="kpiToday"></small><b id="kToday">0s</b></div>
        <div class="kpi"><small data-i18n="kpiAds"></small><b id="kAds">0</b></div>
        <div class="kpi"><small data-i18n="kpiSites"></small><b id="kSites">0</b></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3 data-i18n="chartTitle"></h3>
          <div class="controls">
            <div class="seg" id="metricSeg">
              <button data-metric="s" data-i18n="metricTime"></button>
              <button data-metric="a" data-i18n="metricAds"></button>
            </div>
            <div class="seg" id="rangeSeg">
              <button data-range="7" data-i18n="days7"></button>
              <button data-range="14" data-i18n="days14"></button>
              <button data-range="30" data-i18n="days30"></button>
            </div>
          </div>
        </div>
        <div id="chart" class="chart"></div>
      </div>

      <div class="panel">
        <h3 data-i18n="topSites"></h3>
        <div id="top" class="top"></div>
      </div>

      <button id="resetStats" class="link muted" data-i18n="resetStats"></button>
    </section>

    <!-- ============ Shortcuts ============ -->
    <section id="shortcuts" data-section hidden>
      <h2 data-i18n="scTitle"></h2>
      <p class="sub" data-i18n="scSubtitle"></p>
      <div id="sc" class="panel scs"></div>
      <div class="row between">
        <button id="addSc" class="btn accent" data-i18n="addShortcut"></button>
        <button id="restoreSc" class="link muted" data-i18n="restoreDefaults"></button>
      </div>
    </section>

    <!-- ============ Speed ============ -->
    <section id="speed" data-section hidden>
      <h2 data-i18n="spTitle"></h2>
      <p class="sub" data-i18n="spSubtitle"></p>

      <div class="panel">
        <h3 data-i18n="rememberSpeed"></h3>
        <div class="choices" id="scope">
          <button class="choice" data-scope="site"><b data-i18n="scopeSite"></b><small data-i18n="scopeSiteDesc"></small></button>
          <button class="choice" data-scope="global"><b data-i18n="scopeGlobal"></b><small data-i18n="scopeGlobalDesc"></small></button>
        </div>
      </div>

      <div class="panel">
        <div class="field">
          <div><b data-i18n="presets"></b><small data-i18n="presetsDesc"></small></div>
          <input type="text" id="presets" spellcheck="false" autocomplete="off">
        </div>
        <label class="field">
          <div><b data-i18n="preservePitch"></b><small data-i18n="preservePitchDesc"></small></div>
          <input type="checkbox" id="preservePitch" class="switch">
        </label>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div><h3 data-i18n="savedSites"></h3><small class="muted-text" data-i18n="savedSitesDesc"></small></div>
          <button id="clearSites" class="link muted" data-i18n="clearAll"></button>
        </div>
        <div id="siteList" class="list"></div>
      </div>
    </section>

    <!-- ============ Skipping ============ -->
    <section id="skip" data-section hidden>
      <h2 data-i18n="skTitle"></h2>
      <p class="sub" data-i18n="skSubtitle"></p>

      <div class="panel">
        <label class="field">
          <div><b data-i18n="adSkip"></b><small data-i18n="adSkipDesc"></small></div>
          <input type="checkbox" id="autoSkip" class="switch">
        </label>
        <label class="field">
          <div><b data-i18n="skipIntro"></b><small data-i18n="skipIntroDesc"></small></div>
          <input type="checkbox" id="skipIntro" class="switch">
        </label>
      </div>

      <div class="panel">
        <h3 data-i18n="pausedSites"></h3>
        <small class="muted-text" data-i18n="pausedSitesDesc"></small>
        <div id="pausedList" class="list"></div>
      </div>
    </section>

    <!-- ============ Appearance ============ -->
    <section id="appearance" data-section hidden>
      <h2 data-i18n="apTitle"></h2>
      <p class="sub" data-i18n="apSubtitle"></p>

      <div class="panel">
        <label class="field">
          <div><b data-i18n="overlay"></b><small data-i18n="overlayDesc"></small></div>
          <input type="checkbox" id="overlay" class="switch">
        </label>
        <div class="field top">
          <div><b data-i18n="overlayPos"></b><small data-i18n="overlayPosDesc"></small></div>
          <div class="screen" id="screen">
            <button data-pos="tl" data-i18n-title="posTl"></button>
            <button data-pos="tr" data-i18n-title="posTr"></button>
            <button data-pos="bl" data-i18n-title="posBl"></button>
            <button data-pos="br" data-i18n-title="posBr"></button>
            <span class="badge" id="badge">1.5×</span>
          </div>
        </div>
        <div class="field">
          <b data-i18n="overlaySize"></b>
          <div class="seg" id="sizeSeg">
            <button data-size="s" data-i18n="sizeS"></button>
            <button data-size="m" data-i18n="sizeM"></button>
            <button data-size="l" data-i18n="sizeL"></button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="field">
          <b data-i18n="language"></b>
          <div class="seg" id="langSeg">
            <button data-lang="en">English</button>
            <button data-lang="pt">Português</button>
            <button data-lang="es">Español</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ Data & about ============ -->
    <section id="data" data-section hidden>
      <h2 data-i18n="dtTitle"></h2>
      <p class="sub" data-i18n="dtSubtitle"></p>

      <div class="panel">
        <h3 data-i18n="backup"></h3>
        <div class="row gap wrap">
          <button id="exportCopy" class="btn" data-i18n="exportCopy"></button>
          <button id="exportFile" class="btn" data-i18n="exportFile"></button>
        </div>
      </div>

      <div class="panel">
        <h3 data-i18n="importTitle"></h3>
        <textarea id="importText" rows="5" spellcheck="false" data-i18n-ph="importPaste"></textarea>
        <div class="row between wrap gap">
          <div class="row gap">
            <button id="importFile" class="btn" data-i18n="importFile"></button>
            <input type="file" id="fileInput" accept=".json,application/json" hidden>
          </div>
          <div class="row gap">
            <span id="importMsg" class="muted-text"></span>
            <button id="applyImport" class="btn accent" data-i18n="applyImport"></button>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3 data-i18n="dangerZone"></h3>
        <button id="resetAll" class="btn danger" data-i18n="resetAll"></button>
      </div>

      <div class="panel support" id="support">
        <h3 data-i18n="supportTitle"></h3>
        <p class="muted-text" data-i18n="supportText"></p>
        <div class="row gap wrap">
          <a id="bmc" class="btn primary" target="_blank" rel="noopener">☕ <span data-i18n="buyCoffee"></span></a>
          <button id="pix" class="btn" hidden></button>
          <a id="repo" class="btn" target="_blank" rel="noopener" data-i18n="github"></a>
        </div>
        <p class="muted-text" id="version"></p>
      </div>
    </section>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="../src/shared/defaults.js"></script>
<script src="../src/shared/config.js"></script>
<script src="../src/shared/i18n.js"></script>
<script src="../src/shared/ui.js"></script>
<script src="../src/options/options.js"></script>
</body>
</html>
