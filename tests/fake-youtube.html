<!doctype html>
<meta charset="utf-8">
<title>Fake YouTube ad player</title>
<div id="player" class="html5-video-player ad-showing">
  <video id="v" muted width="480" height="270" src="silence.wav"></video>
  <button id="skip" class="ytp-skip-ad-button">Skip</button>
</div>
<script>
  const mode = new URLSearchParams(location.search).get('mode') || 'strict';
  const player = document.getElementById('player');
  const skip = document.getElementById('skip');
  window.__clicks = 0;
  window.__events = [];

  const endAd = () => { player.classList.remove('ad-showing'); skip.hidden = true; };

  for (const type of ['pointerdown', 'mousedown', 'pointerup', 'mouseup']) {
    skip.addEventListener(type, (e) => window.__events.push(type + (e.isTrusted ? '' : '*')));
  }
  skip.addEventListener('click', (e) => {
    window.__clicks++;
    if (mode === 'lenient' || e.isTrusted) endAd();
  });
</script>
