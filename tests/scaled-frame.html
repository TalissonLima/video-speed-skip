<!doctype html>
<meta charset="utf-8">
<title>Scaled frame</title>
<!-- Used by tests/e2e/store_screenshots.py: shows ?url= in a w x h frame scaled by s, so a 1280x800 page can be
     photographed as, for example, 800x500 (#box is the element that gets photographed). -->
<style>
  html, body { margin: 0; background: #1e1b4b; }
  #box { overflow: hidden; }
  iframe { border: 0; display: block; transform-origin: 0 0; background: #fff; }
</style>
<div id="box"><iframe id="f"></iframe></div>
<script>
  const q = new URLSearchParams(location.search);
  const w = Number(q.get('w')) || 1280, h = Number(q.get('h')) || 800, s = Number(q.get('s')) || 1;
  document.getElementById('box').style.cssText = `width:${w * s}px;height:${h * s}px`;
  const f = document.getElementById('f');
  f.style.cssText = `width:${w}px;height:${h}px;transform:scale(${s})`;
  f.src = q.get('url');
</script>
